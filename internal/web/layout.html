{{define "top"}}
  <!doctype html>
  <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>
        Playlist Breakup
      </title>
      <link rel="stylesheet" href="/style.css">
      <script src="/progress.js" defer>
      </script>
    </head>
    <body>
      <main>
        {{if .Message}}
          <p class="notice" role="alert">
            {{.Message}}
          </p>
        {{end}}
      {{end}}

{{define "bottom"}}
</main>
<footer>
  Local data is not encrypted. Classification evidence stays on your machine. Lookups send song metadata to LRCLIB and Lyrics.ovh.
</footer>
</body>
</html>
{{end}}

{{define "csrf"}}
  <input type="hidden" name="csrf" value="{{.CSRF}}">
{{end}}
